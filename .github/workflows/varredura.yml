name: Varredura de ativos

# Uma vez por mês (dia 6, 09:00 de Brasília) ou na hora, em Actions → Run workflow.
# Lê o arquivo de cotações da B3 do mês anterior e acrescenta às listas os ativos líquidos que faltam.
on:
  schedule:
    - cron: "0 12 6 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Varrer
        run: python varredura.py
      - name: Salvar listas
        run: |
          git config user.name  "radar-b3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers.csv listas/ saida/varredura.md
          if git diff --cached --quiet; then echo "Nada novo."; else git commit -m "Varredura de ativos $(TZ=America/Sao_Paulo date +'%d/%m/%Y')" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; fi
