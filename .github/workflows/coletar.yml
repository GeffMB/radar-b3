name: Coleta diária

on:
  schedule:
    # 21:40 UTC = 18:40 em Brasília, de segunda a sexta (depois do fechamento da B3)
    - cron: "40 21 * * 1-5"
  workflow_dispatch:      # botão "Run workflow" para rodar na hora
    inputs:
      parte:
        description: "O que coletar"
        type: choice
        options: [tudo, acoes, mercado]
        default: tudo

# Permissão mínima: só gravar no próprio repositório. O token expira ao fim de cada execução.
# Versões das actions fixadas por SHA: uma tag alterada por terceiros não muda o que roda aqui.
permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar ações
        if: ${{ github.event_name == 'schedule' || inputs.parte != 'mercado' }}
        run: python coletar.py

      - name: Coletar FIIs, ETFs, BDRs, stocks, índices, commodities, renda fixa e Tesouro
        if: ${{ github.event_name == 'schedule' || inputs.parte != 'acoes' }}
        continue-on-error: true      # uma fonte fora do ar não impede salvar as ações
        run: python mercado.py

      - name: Salvar resultado no repositório
        if: always()
        run: |
          git config user.name  "radar-b3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ saida/historico.csv
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Coleta $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Guardar o log da execução
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: execucao-log
          path: saida/execucao.log
          retention-days: 14
