name: Sondagem de fontes (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python ferramentas/sondagem.py
      - name: Publicar resultado no branch sondagem
        if: always()
        run: |
          mkdir /tmp/s && cp sondagem.txt /tmp/s/ || echo "sem arquivo" > /tmp/s/sondagem.txt
          cd /tmp/s && git init -q -b sondagem && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sondagem \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sondagem
