name: Sondagem de fontes (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ferramentas/sondagem.py
      - name: Publicar resultado no branch sondagem
        if: always()
        run: |
          cp sondagem.txt /tmp/sondagem.txt || echo "sem arquivo" > /tmp/sondagem.txt
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout -q --orphan resultado
          git rm -rq --cached . && git clean -fdxq
          cp /tmp/sondagem.txt . && git add sondagem.txt && git commit -qm sondagem
          git push -f origin HEAD:sondagem 2>&1 | tail -3
