name: Publicar Assistente (Cloudflare)

# Roda quando o código do Assistente muda no GitHub, ou manualmente em Actions → Run workflow.
on:
  push:
    branches: [main]
    paths: ["worker/assistente.js", "worker/wrangler.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistente
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Publicar no Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx --yes wrangler@4.145.0 deploy
      - name: Conferir se respondeu
        run: |
          sleep 5
          curl -sS -o /dev/null -w "Diagnóstico: HTTP %{http_code}\n" https://radar-assistente.gefersonmarques.workers.dev/diagnostico || true
