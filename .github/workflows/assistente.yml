name: Publicar Assistente (Cloudflare)

# Roda quando o código do Assistente muda no GitHub, ou manualmente em Actions → Run workflow.
on:
  push:
    branches: [main]
    paths: ["worker/assistente.js", "worker/wrangler.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistente
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Publicar no Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions."
            exit 1
          fi
          set +e
          npx --yes wrangler@4.145.0 deploy 2>&1 | tee saida.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            # Mostra o motivo como aviso no resumo da execução (sem o token, que o GitHub já oculta).
            grep -E "ERROR|✘|Authentication|permission|code: [0-9]+|requires|Node" saida.txt | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$rc"
          fi
      - name: Conferir se respondeu
        run: |
          sleep 5
          curl -sS -o /dev/null -w "Diagnóstico: HTTP %{http_code}\n" https://radar-assistente.gefersonmarques.workers.dev/diagnostico || true
          r=$(curl -sS -H "Origin: https://geffmb.github.io" "https://radar-assistente.gefersonmarques.workers.dev/cotacoes?s=PETR4.SA,BBAS3.SA,MXRF11.SA,USDBRL%3DX,%5EBVSP,AAPL,BZ%3DF" | head -c 600)
          echo "::notice::cotacoes -> $r"
          for s in PETR4.SA; do
            r=$(curl -sS -H "Origin: https://geffmb.github.io" "https://radar-assistente.gefersonmarques.workers.dev/cotacao?s=$s&f=1D" | head -c 220)
            echo "::notice::cotacao $s -> $r"
          done
