name: Publicar Assistente (Cloudflare)

# Roda quando o código do Assistente muda no GitHub, ou manualmente em Actions → Run workflow.
on:
  push:
    branches: [main]
    paths: ["worker/assistente.js", "worker/bot.js", "worker/wrangler.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistente
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Publicar no Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions."
            exit 1
          fi
          set +e
          npx --yes wrangler@4.145.0 deploy 2>&1 | tee saida.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            # Mostra o motivo como aviso no resumo da execução (sem o token, que o GitHub já oculta).
            grep -E "ERROR|✘|Authentication|permission|code: [0-9]+|requires|Node" saida.txt | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$rc"
          fi
      - name: Bot do Telegram (token e endereço)
        # Só roda se o segredo RADAR_TELEGRAM_TOKEN existir (Settings → Secrets and variables → Actions).
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$TG" ]; then echo "Bot do Telegram desligado (sem o segredo RADAR_TELEGRAM_TOKEN)."; exit 0; fi
          printf '%s' "$TG" | npx --yes wrangler@4.145.0 secret put TELEGRAM_TOKEN > /dev/null
          seg=$(printf 'radar-b3-tg|%s' "$TG" | sha256sum | cut -c1-48)
          r=$(curl -sS -X POST "https://api.telegram.org/bot$TG/setWebhook" -H "Content-Type: application/json" \
            -d "{\"url\":\"https://radar-assistente.gefersonmarques.workers.dev/tg\",\"secret_token\":\"$seg\",\"allowed_updates\":[\"message\",\"callback_query\"]}")
          echo "::notice::Telegram webhook -> $r"
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG/setMyCommands" -H "Content-Type: application/json" -d '{"commands":[
            {"command":"preco","description":"Cotação e indicadores (ex.: /preco BBAS3)"},
            {"command":"barsi","description":"Ações que passam no método Barsi"},
            {"command":"teto","description":"Preço-teto e critérios (ex.: /teto TAEE11)"},
            {"command":"proventos","description":"Próximos pagamentos (ex.: /proventos ITSA4)"},
            {"command":"agenda","description":"Eventos importantes dos próximos 7 dias"},
            {"command":"mercado","description":"Ibovespa, dólar, juros e bolsas lá fora"},
            {"command":"alerta","description":"Alerta de preço (ex.: /alerta BBAS3 15,50)"},
            {"command":"alertas","description":"Lista e apaga alertas"},
            {"command":"seguir","description":"Seguir ações (proventos e Barsi)"},
            {"command":"seguindo","description":"Painel das ações que você segue"},
            {"command":"noticias","description":"Últimas notícias (ex.: /noticias BBAS3)"},
            {"command":"variacao","description":"Aviso de variação forte (ex.: /variacao 5)"},
            {"command":"ligar","description":"Código para os avisos do site virem aqui"},
            {"command":"convidar","description":"Convidar outra pessoa para usar o bot"},
            {"command":"convidados","description":"Convidados: ver e remover"},
            {"command":"resumo","description":"Liga/desliga o resumo das 8h30"},
            {"command":"lembretes","description":"Liga/desliga lembretes de eventos"},
            {"command":"ajuda","description":"Todos os comandos"}]}'
          info=$(curl -sS "https://api.telegram.org/bot$TG/getWebhookInfo" | head -c 400)
          echo "::notice::Telegram -> $info"

      - name: Conferir se respondeu
        run: |
          sleep 5
          curl -sS -o /dev/null -w "Diagnóstico: HTTP %{http_code}\n" https://radar-assistente.gefersonmarques.workers.dev/diagnostico || true
          r=$(curl -sS -H "Origin: https://geffmb.github.io" "https://radar-assistente.gefersonmarques.workers.dev/cotacoes?s=PETR4.SA,BBAS3.SA,MXRF11.SA,USDBRL%3DX,%5EBVSP,AAPL,BZ%3DF" | head -c 600)
          echo "::notice::cotacoes -> $r"
          for s in PETR4.SA; do
            r=$(curl -sS -H "Origin: https://geffmb.github.io" "https://radar-assistente.gefersonmarques.workers.dev/cotacao?s=$s&f=1D" | head -c 220)
            echo "::notice::cotacao $s -> $r"
          done
