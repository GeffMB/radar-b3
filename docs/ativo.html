<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Ativo · Radar B3</title>

<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32" type="image/png">

<style>
/* Página de um ativo: cabeçalho com cotação e faixa de 52 semanas, cartões de indicadores, gráfico de cotação, proventos e P/VP */

.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px}
.hero-id{display:flex;align-items:center;gap:16px;min-width:0}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.025em;margin:0;line-height:1}
.hero .sub{color:var(--muted);margin-top:6px}
.hero .sub b{color:var(--ink);font-weight:600}
.price{text-align:right;display:grid;gap:2px;justify-items:end}
@media (max-width:600px){.price{text-align:left;justify-items:start}}
#conteudo{display:grid;gap:18px}
.price .v{font-family:var(--font-display);font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price .d{font-family:var(--font-num);font-size:14px}

.range52{display:grid;gap:4px;min-width:220px;flex:0 1 300px}
.range52 .bar{position:relative;height:6px;border-radius:3px;background:var(--soft)}
.range52 .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.range52 .ends{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:12px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cards .label{display:flex;gap:6px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:6px;align-content:start}
.card .v{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .cmp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.ph h2{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.ph .note{font-size:13px;color:var(--muted)}
.ph .note b{font-family:var(--font-num);font-weight:600}
.chart{position:relative;height:300px;min-width:0}
.chart.short{height:260px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.provtab{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:12px}
.provtab table{border-collapse:collapse;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.provtab th{position:sticky;top:0;background:var(--surface-2);text-align:right;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.provtab th:first-child,.provtab td:first-child{text-align:left;position:static}
.provtab td{padding:8px 10px;border-bottom:1px solid var(--soft);font-size:14px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 20px}
.stats>div{display:grid;gap:2px;align-content:start}
.stats .v{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stats .cmp{font-size:12px;color:var(--muted)}
.note.small{font-size:12px;color:var(--muted);margin:0}

.ranges{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.ranges button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .15s,color .15s}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(34,48,46,.10)}
.card .tag,.stats .tag{justify-self:start}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links .btn{font-size:13px;padding:6px 12px}
.hero-ic svg{width:60%;height:60%}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)}
tr.futuro td{background:var(--good-bg)}

</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="./" aria-label="Radar B3, início">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 23a10 10 0 0 1 14-14" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round" opacity=".55"/><path d="M12.5 21a5.5 5.5 0 0 1 8-8" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/><circle cx="21.5" cy="10.5" r="2.4" fill="var(--accent-2)"/><circle cx="10" cy="22" r="1.8" fill="var(--accent-ink)"/></svg>
    <span>Radar <b>B3</b></span></a>
  <nav class="nav" data-atual="" aria-label="Principal"><a href="./">Ações</a><a href="mercado.html?c=fiis">FIIs</a><a href="comparar.html">Comparar</a></nav>
  <form class="jump" id="jump" role="search"><input id="jump-t" list="jump-lista" placeholder="Buscar: PETR4, MXRF11, AAPL…" aria-label="Buscar ativo" autocomplete="off"><datalist id="jump-lista"></datalist></form>
  <button class="tema" id="tema" type="button" aria-label="Usar modo escuro"><svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
</div></header>
<main class="wrap" id="main">
  <div id="conteudo" style="display:grid;gap:18px">
  <section class="hero" id="hero"><div class="msg" style="width:100%">Carregando…</div></section>
  <section class="cards" id="cards" aria-label="Indicadores"></section>
  <section class="panel" id="p-preco">
    <div class="ph"><h2>Cotação</h2>
      <div class="ranges" id="modo" hidden><button type="button" data-m="preco" aria-pressed="true">Preço</button><button type="button" data-m="retorno">Retorno total</button></div>
      <span class="note" id="var-periodo"></span>
      <div class="ranges" id="tipo" hidden><button type="button" data-t="linha">Linha</button><button type="button" data-t="candle">Candles</button></div>
      <div class="ranges" id="ranges"><button type="button" data-r="1D" data-vivo>1D</button><button type="button" data-r="5D" data-vivo>5D</button><button type="button" data-r="1M">1M</button><button type="button" data-r="6M">6M</button><button type="button" data-r="1A">1A</button><button type="button" data-r="2A">2A</button><button type="button" data-r="5A">5A</button></div></div>
    <div class="chart" id="cx-preco"><canvas id="c-preco" aria-label="Gráfico de cotação"></canvas></div>
    <div class="chart lwc" id="lwc" hidden aria-label="Gráfico de candles"></div>
    <p class="note small" id="aprox" hidden></p>
  </section>
  <section class="two" id="p-prov" hidden>
    <div class="panel"><div class="ph"><h2 id="prov-tit">Proventos</h2><span class="note" id="prov-nota"></span></div>
      <div class="chart short"><canvas id="c-prov" aria-label="Gráfico de proventos"></canvas></div></div>
    <div class="panel"><div class="ph"><h2>Últimos pagamentos</h2></div><div class="provtab" id="prov-tab"></div></div>
  </section>
  <section class="panel" id="p-pvp" hidden>
    <div class="ph"><h2>P/VP ao longo do tempo</h2><span class="note">Cotação no fim de cada mês ÷ valor patrimonial informado à CVM</span></div>
    <div class="stats" id="pvp-stats"></div>
    <div class="chart short"><canvas id="c-pvp" aria-label="Gráfico de P/VP"></canvas></div>
  </section>
  </div>
</main>
<footer class="site">
  <p>Dados: Yahoo Finance, B3 e CVM · Material de estudo, não é recomendação de investimento.</p>
</footer>

<script src="vendor/chart.umd.js"></script>
<script src="vendor/lightweight-charts.js"></script>
<script src="candles.js"></script>
<script src="assistente.js"></script>
<script src="comum.js"></script>
<script src="ativo.js"></script>
</body>
</html>
